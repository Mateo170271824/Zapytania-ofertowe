name: Publikacja aplikacji (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # test ekranowy całej aplikacji na emulatorze bazy i wymyślonych danych
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Narzędzia testowe
        run: |
          npm install --no-save --no-package-lock firebase-tools@13.29.1 firebase@10.12.2 @firebase/rules-unit-testing@3.0.4 playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Test ekranowy
        run: |
          python3 -m http.server 8766 >/dev/null 2>&1 &
          npm run test:e2e

  deploy:
    needs: e2e
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # gdy testy nie przejdą, strona się nie zmienia
      - name: Testy
        run: npm test
      # Zapytania działają w SteelFlow (steel-flow.web.app/zapytania/) – tu tylko przekierowanie ze starego adresu
      - name: Strona przekierowania
        run: mkdir www && cp przekierowanie/index.html przekierowanie/404.html przekierowanie/sw.js www/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4

  # nowa wersja Zapytań od razu w SteelFlow (bez sekretu: przy sprawdzeniu co 2 godziny)
  steelflow:
    needs: testy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HAS_ZAPIS: ${{ secrets.STEELFLOW_ZAPIS != '' }}
    steps:
      - name: Odświeżenie SteelFlow
        env:
          T: ${{ secrets.STEELFLOW_ZAPIS }}
        run: |
          if [ "$HAS_ZAPIS" != "true" ]; then echo "::notice::Brak sekretu STEELFLOW_ZAPIS – SteelFlow pobierze nową wersję Zapytań przy sprawdzeniu co 2 godziny."; exit 0; fi
          k=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $T" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Mateo170271824/Logistyka/actions/workflows/steelflow.yml/dispatches -d '{"ref":"main"}')
          if [ "$k" = "204" ]; then echo "Uruchomiono publikację SteelFlow."; else echo "::warning::Nie udało się uruchomić publikacji SteelFlow (HTTP $k)."; fi

