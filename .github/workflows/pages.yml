name: Publikacja aplikacji (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # test ekranowy całej aplikacji na emulatorze bazy i wymyślonych danych
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Narzędzia testowe
        run: |
          npm install --no-save --no-package-lock firebase-tools@13.29.1 firebase@10.12.2 @firebase/rules-unit-testing@3.0.4 playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Test ekranowy
        run: |
          python3 -m http.server 8766 >/dev/null 2>&1 &
          npm run test:e2e

  deploy:
    needs: e2e
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # gdy testy nie przejdą, strona się nie zmienia
      - name: Testy
        run: npm test
      - name: Pliki strony
        run: |
          mkdir www
          cp -r index.html manifest.webmanifest icon.svg icons sw.js css js img vendor www/
          # każda publikacja ma własną wersję plików (?v=…), żeby przeglądarka nie trzymała starych
          V="${GITHUB_SHA::10}"
          # wszystkie pliki, także w podkatalogach (js/czesci/) – inaczej przeglądarka wczyta app.js dwa razy
          find www -name '*.js' -path 'www/js/*' -exec sed -i -E "s/\?v=[0-9A-Za-z]+/?v=$V/g" {} +
          sed -i -E "s/\?v=[0-9A-Za-z]+/?v=$V/g" www/index.html
          if grep -rhoE "\?v=[0-9A-Za-z]+" www/index.html www/js | grep -v "?v=$V" | grep -q .; then echo "::error::Zostały pliki ze starą wersją ?v="; grep -rnE "\?v=[0-9A-Za-z]+" www/index.html www/js | grep -v "?v=$V"; exit 1; fi
          grep -c "?v=$V" www/index.html www/js/app.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
