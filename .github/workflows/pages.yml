name: Publikacja aplikacji (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # gdy testy nie przejdą, strona się nie zmienia
      - name: Testy
        run: npm test
      - name: Pliki strony
        run: |
          mkdir www
          cp -r index.html manifest.webmanifest icon.svg css js img vendor www/
          # każda publikacja ma własną wersję plików (?v=…), żeby przeglądarka nie trzymała starych
          V="${GITHUB_SHA::10}"
          sed -i -E "s/\?v=[0-9A-Za-z]+/?v=$V/g" www/index.html www/js/*.js
          grep -c "?v=$V" www/index.html www/js/app.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
